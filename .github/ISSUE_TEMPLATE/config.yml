# Issue template chooser configuration.
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

blank_issues_enabled: false
contact_links:
  - name: Documentation
    url: https://github.com/coderooz/earnsetu-basket/blob/master/docs/README.md
    about: Read the documentation index before opening an issue.

  - name: Known limitations
    url: https://github.com/coderooz/earnsetu-basket/blob/master/docs/KNOWN_LIMITATIONS.md
    about: Several current gaps (no auth, no backend, lint failing) are already tracked.

  - name: Security report
    url: https://github.com/coderooz/earnsetu-basket/security/advisories/new
    about: Please report security vulnerabilities privately (do not open a public issue).

  - name: Questions & general discussion
    url: https://github.com/coderooz/earnsetu-basket/discussions
    about: Ask questions or discuss ideas (if Discussions is enabled).
