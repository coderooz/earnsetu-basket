name: Feature request
description: Suggest a new feature or improvement for EarnSetu Basket.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please note the project is an **early prototype**:
        the shopping-list domain is not implemented yet, and many capabilities depend on
        unresolved EarnSetu ecosystem decisions
        ([docs/architecture/INTEGRATION_BOUNDARIES.md](../../docs/architecture/INTEGRATION_BOUNDARIES.md)).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have checked the roadmap and product scope docs.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Shopping lists / items
        - Purchase recording / history
        - Offline / persistence
        - Synchronization
        - Authentication
        - Backend / API integration
        - UI / UX
        - Tooling / CI
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Does this change the architecture?
      description: Architecture changes require an ADR before implementation.
      options:
        - "No"
        - "Yes (an ADR will be needed)"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
