name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck · Doctor · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts avoids running the `prepare` script (`expo install --fix`)
      # during CI installs; CI should validate, not mutate, dependencies.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx expo-doctor

      # Lint is required: the `@typescript-eslint/parser` resolution issue is fixed
      # (see docs/decisions/ADR-0004_eslint-parser-hoist.md) and `npm run lint` passes.
      - name: Lint
        run: npm run lint

      # Formatting is not yet enforced. Informational only.
      - name: Prettier check (non-blocking)
        run: npx prettier --check .
        continue-on-error: true
